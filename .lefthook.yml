pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true

    - name: biome
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,yaml,yml,css}"
      run: pnpm exec biome check --write --linter-enabled=false --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: tombi
      glob: "*.toml"
      run: pnpm exec tombi format {staged_files}
      stage_fixed: true

    - name: gitleaks
      # Fail rather than skip, so a missing install never passes unchecked.
      run: >-
        command -v gitleaks >/dev/null
        || { echo "gitleaks is not installed, see README.md#development" >&2; exit 1; }
        && gitleaks git --pre-commit --staged --no-banner --redact --verbose

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
