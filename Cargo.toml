[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
# `deny`, not `forbid`: the sqlite-vec loader in histrail-store opts out with
# `#[expect(unsafe_code, reason = "...")]`, which `forbid` would reject.
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

# Tests are exempted in .clippy.toml.
expect_used = "deny"
unwrap_used = "deny"

# stdout is the protocol channel in `proxy` and `histrail mcp`; log with tracing.
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

# A new variant must fail to compile where it is matched.
# `wildcard_enum_match_arm` misses a wildcard covering a single remaining variant.
match_wildcard_for_single_variants = "deny"
wildcard_enum_match_arm = "deny"
