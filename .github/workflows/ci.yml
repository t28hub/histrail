name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Catch new advisories without a push.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.59.0

jobs:
  check-fmt:
    name: check | fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install just
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Check formatting
        run: just check

  check-lint:
    name: check | lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install just
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Lint
        run: just lint

  check-deny:
    name: check | deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-deny@0.22.0

      - name: Check dependency licenses and advisories
        run: just deny

  check-leaks:
    name: check | leaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the release, matching the digest GitHub records.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Every commit is scanned, not only the tip.
          fetch-depth: 0
      - name: Install just
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir gitleaks
          tar --extract --gzip --file "${archive}" --directory gitleaks gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Check for leaked secrets
        run: just leaks
