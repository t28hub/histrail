name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.59.0

jobs:
  check-fmt:
    name: check | fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install just
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Check formatting
        run: just check

  check-lint:
    name: check | lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install just
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Lint
        run: just lint

  check-deny:
    name: check | deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-deny@0.22.0

      - name: Check dependency licenses and advisories
        run: just deny
