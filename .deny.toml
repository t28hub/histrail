[graph]
all-features = true
# Desktop targets Histrail ships for.
targets      = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
ignore  = [
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 comes from Tauri's GTK 3 stack, which requires ^0.18; the fix is only in 0.20+" },
]
# Captured content is untrusted, so transitive unsoundness matters too.
unsound = "all"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
wildcards            = "deny"
# Workspace crates depend on each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
